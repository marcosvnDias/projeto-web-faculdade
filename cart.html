<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compras</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <span>Carrinho de Compras</span>
    </header>
    <main>
      <div class="page-title" id="numeroPedido">Pedido #</div>
      <div class="content">
        <section>
          <table>
            <thead>
              <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade</th>
                <th>Total</th>
                <th>-</th>
              </tr>
            </thead>
            <tbody id="tabelaProduto">
            </tbody>
          </table>
        </section>
        <aside>
          <div class="box">
            <header>Resumo da compra</header>
            <div class="info">
              <div>
                <span>Sub-total</span>
                <span id="subTotal">R$ 00,00</span>
              </div>

              <div>
                <span>Frete</span>
                <span>Gratuito</span>
              </div>

              <div id="linhaDesconto" style="display: none; color: #3bc55b; font-weight: bold;">
                <span>Desconto</span>
                <span id="valorDesconto">- R$ 0,00</span>
              </div>

              <div>
                <button id="botao-desconto">
                  Adicionar cupom de desconto
                  <i class="bx bx-right-arrow-alt"></i>
                </button>

                <div id="area-cupom" class="cupom-container" style="display: none;">
                  <input type="text" id="input-cupom" placeholder="Digite o cupom (ex: DESC10)" />
                  <button id="aplicar-cupom">Aplicar</button>
                </div>
              </div>
            </div>
            <footer>
              <span>Total</span>
              <span id="totalCompra">R$ 00,00</span>
            </footer>
          </div>
          <button>Finalizar Compra</button>
        </aside>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
